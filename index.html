  /* ---------- 深浅色切换 ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.theme-toggle'),function(btn){
    btn.addEventListener('click',function(){
      var t=root.getAttribute('data-theme')==='dark'?'light':'dark';
      root.setAttribute('data-theme',t);
      try{localStorage.setItem('note-theme',t)}catch(e){}
    });
  });

  /* ---------- 移动端抽屉（事件委托，动态目录同样生效） ---------- */
  var sidebar=document.getElementById('sidebar');
  var backdrop=document.getElementById('backdrop');
  function closeDrawer(){sidebar.classList.remove('open');backdrop.classList.remove('show')}
  document.getElementById('menuBtn').addEventListener('click',function(){
    sidebar.classList.add('open');backdrop.classList.add('show');
  });
  backdrop.addEventListener('click',closeDrawer);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeDrawer()});
  sidebar.addEventListener('click',function(e){
    if(!e.target||!e.target.closest)return;
    var head=e.target.closest('.group-head');
    if(head){
      var g=head.closest('.group');
      if(g){
        g.classList.toggle('collapsed');
        head.setAttribute('aria-expanded',g.classList.contains('collapsed')?'false':'true');
      }
      return;
    }
    var card=e.target.closest('a.note-card-slot');
    if(card&&byId[card.getAttribute('data-note')]){
      showNote(card.getAttribute('data-note'));
    }
    if(e.target.closest('a'))closeDrawer();
  });

  /* ---------- 元素 ---------- */
  var gate=document.getElementById('gate');
  var post=document.getElementById('post');
  var toc=document.getElementById('toc');
  var lockBtn=document.getElementById('lockBtn');
  var searchInput=document.getElementById('search');
  var statusEl=document.getElementById('searchStatus');
  var gateForm=document.getElementById('gateForm');
  var passInput=document.getElementById('gatePass');
  var gateError=document.getElementById('gateError');

  var LOCKED_CARD_HTML='<span class="note-date">已加密</span><span class="note-title">输入密码解锁笔记</span>';
  var NOTES=[];var byId={};
  function fillCardSlots(){
    Array.prototype.forEach.call(document.querySelectorAll('.note-card-slot'),function(el){
      var n=byId[el.getAttribute('data-note')];
      el.innerHTML=n?n.card:LOCKED_CARD_HTML;
    });
  }
  function showNote(id){
    var n=byId[id];
    if(!n)return;
    post.innerHTML=n.post;
    toc.innerHTML='<section class="group"><button class="group-head" type="button" aria-expanded="true"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="group-title">本篇脉络</span></button><div class="group-body">'+n.toc+'</div></section>';
    Array.prototype.forEach.call(document.querySelectorAll('.note-card-slot'),function(el){
      el.classList.toggle('active',el.getAttribute('data-note')===id);
    });
    post.hidden=false;
    searchInput.value='';
    statusEl.textContent='';
  }
  function activate(data){
    NOTES=data.notes||[];byId={};
    NOTES.forEach(function(n){byId[n.id]=n});
    fillCardSlots();
    showNote((data.default&&byId[data.default])?data.default:NOTES[0].id);
    gate.hidden=true;
    lockBtn.classList.remove('hide');
    searchInput.disabled=false;
  }

  /* ---------- 按周 / 按分类 视图切换 ---------- */
  var viewTabs=Array.prototype.slice.call(document.querySelectorAll('.view-tab'));
  var viewPanes={week:document.getElementById('viewWeek'),cat:document.getElementById('viewCat')};
  var activeView='week';
  viewTabs.forEach(function(tab){
    tab.addEventListener('click',function(){
      viewTabs.forEach(function(t){t.classList.toggle('active',t===tab)});
      activeView=tab.getAttribute('data-view');
      clearSearch();
    });
  });

  /* ---------- 解锁 / 渲染 ---------- */
  function deriveKey(pass){
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey'])
      .then(function(km){
        return crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:SALT,iterations:150000,hash:'SHA-256'},
          km,{name:'AES-GCM',length:256},false,['decrypt']
        );
      });
  }
  function decryptPayload(pass){
    return deriveKey(pass).then(function(key){
      var raw=Uint8Array.from(atob(PAYLOAD_B64),function(c){return c.charCodeAt(0)});
      var iv=raw.subarray(0,12),ct=raw.subarray(12);
      return crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct);
    }).then(function(buf){
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }
  function relock(){
    try{sessionStorage.removeItem('note-pass')}catch(e){}
    NOTES=[];byId={};
    post.innerHTML='';
    post.hidden=true;
    gate.hidden=false;
    fillCardSlots();
    toc.innerHTML='<section class="group"><button class="group-head" type="button" aria-expanded="true"><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="group-title">本篇脉络</span></button><div class="group-body"></div></section>';
    lockBtn.classList.add('hide');
    searchInput.value='';
    searchInput.disabled=true;
    statusEl.textContent='';
    resultsBox.hidden=true;
    resultsBox.innerHTML='';
    passInput.value='';
    gateError.textContent='';
    passInput.focus();
  }

  gateForm.addEventListener('submit',function(e){
    e.preventDefault();
    var pass=passInput.value;
    if(!pass)return;
    gateError.textContent='';
    decryptPayload(pass).then(function(data){
      try{sessionStorage.setItem('note-pass',pass)}catch(err){}
      activate(data);
    }).catch(function(){
      gateError.textContent='密码不对，请再试一次';
      passInput.focus();
      passInput.select();
    });
  });
  lockBtn.addEventListener('click',relock);

  /* ---------- 启动：本会话已解锁则直接恢复 ---------- */
  var saved=null;
  try{saved=sessionStorage.getItem('note-pass')}catch(e){}
  if(saved){
    decryptPayload(saved).then(activate).catch(function(){
      try{sessionStorage.removeItem('note-pass')}catch(e){}
      passInput.focus();
    });
  }else{
    passInput.focus();
  }

  function clearSearch(){
    searchInput.value='';
    statusEl.textContent='';
    resultsBox.hidden=true;
    resultsBox.innerHTML='';
    viewPanes.week.hidden=(activeView!=='week');
    viewPanes.cat.hidden=(activeView!=='cat');
    toc.hidden=false;
  }

  /* ---------- 跨笔记搜索：名字或内容找文章 ---------- */
  var resultsBox=document.getElementById('searchResults');
  function stripTags(s){return s.replace(/<[^>]*>/g,'')}
  searchInput.addEventListener('input',function(){
    var q=searchInput.value.trim().toLowerCase();
    if(!q){clearSearch();return}
    var hits=[];
    NOTES.forEach(function(n){
      var txt=stripTags(n.card)+' '+stripTags(n.post);
      var idx=txt.toLowerCase().indexOf(q);
      if(idx!==-1){
        var start=Math.max(0,idx-25);
        var snip=(start>0?'…':'')+txt.slice(start,Math.min(txt.length,idx+q.length+45))+'…';
        hits.push({id:n.id,card:n.card,snip:snip});
      }
    });
    viewPanes.week.hidden=true;
    viewPanes.cat.hidden=true;
    toc.hidden=true;
    resultsBox.innerHTML='<div class="group-label">搜索结果 · '+hits.length+' 篇</div>'+
      (hits.length
        ?hits.map(function(h){return '<a class="note-card" href="#top" data-note="'+h.id+'">'+h.card+'<span class="note-snip">'+h.snip+'</span></a>'}).join('')
        :'<div class="cat-empty">没有匹配的笔记</div>');
    resultsBox.hidden=false;
    statusEl.textContent='';
  });
  resultsBox.addEventListener('click',function(e){
    var card=e.target&&e.target.closest?e.target.closest('a.note-card'):null;
    if(!card)return;
    showNote(card.getAttribute('data-note'));
    clearSearch();
  });
})();
</script>

</body>
</html>
